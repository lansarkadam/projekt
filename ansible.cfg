[defaults]
remote_user = devops
inventory=/home/devops/github/projekt/inventory
roles_path=/home/devops/github/projekt/roles:/usr/share/ansible/roles:/etc/ansible/roles
collections_path=/home/devops/github/projekt/collections:/usr/share/ansible/collections
host_key_checking = False

[privilege_escalation]
become = True
become_method = sudo
become_user = root
